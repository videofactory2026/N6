workflows:
  android-workflow:
    name: Android Production Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      groups:
        # Add this group in Codemagic UI with required variables
        - nutriwalk_production
      
      vars:
        FLUTTER_VERSION: "3.19.0"
        PACKAGE_NAME: "com.nutriwalk.ai"
      
      android_signing:
        - nutriwalk_keystore
      
      flutter: stable
      xcode: latest
      cocoapods: default
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      cancel_previous_builds: true
    
    scripts:
      - name: Get Flutter version
        script: |
          flutter --version
          flutter doctor
      
      - name: Set up key.properties for Android signing
        script: |
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Run code analysis
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test
        ignore_failure: true
      
      - name: Build Android AAB
        script: |
          BUILD_NUMBER=$(($BUILD_NUMBER + 1))
          flutter build appbundle \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols
      
      - name: Generate unsigned APK for testing
        script: |
          flutter build apk --release
    
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/apk/release/*.apk
      - build/app/outputs/symbols/**/*
      - build/app/outputs/mapping/release/mapping.txt
    
    publishing:
      email:
        recipients:
          - $RECIPIENT_EMAIL
        notify:
          success: true
          failure: true
      
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
        in_app_update_priority: 0
        rollout_fraction: 0.1
        changes_not_sent_for_review: false

  ios-workflow:
    name: iOS Production Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      groups:
        - nutriwalk_production
      
      vars:
        FLUTTER_VERSION: "3.19.0"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.nutriwalk.ai"
      
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nutriwalk.ai
      
      flutter: stable
      xcode: latest
      cocoapods: default
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      cancel_previous_builds: true
    
    scripts:
      - name: Get Flutter version
        script: |
          flutter --version
          flutter doctor
      
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      
      - name: Run code analysis
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test
        ignore_failure: true
      
      - name: Build iOS IPA
        script: |
          BUILD_NUMBER=$(($BUILD_NUMBER + 1))
          flutter build ipa \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --obfuscate \
            --split-debug-info=build/ios/symbols \
            --export-options-plist=$HOME/export_options.plist
    
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/symbols/**/*
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    
    publishing:
      email:
        recipients:
          - $RECIPIENT_EMAIL
        notify:
          success: true
          failure: true
      
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false

  android-debug-workflow:
    name: Android Debug Build (for testing)
    max_build_duration: 30
    instance_type: linux_x2
    
    environment:
      vars:
        FLUTTER_VERSION: "3.19.0"
      flutter: stable
    
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'develop'
          include: true
          source: true
        - pattern: 'feature/*'
          include: true
          source: true
      cancel_previous_builds: true
    
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Run code analysis
        script: |
          flutter analyze
      
      - name: Run tests with coverage
        script: |
          flutter test --coverage
      
      - name: Build Debug APK
        script: |
          flutter build apk --debug
    
    artifacts:
      - build/app/outputs/apk/debug/*.apk
      - coverage/lcov.info
    
    publishing:
      email:
        recipients:
          - $RECIPIENT_EMAIL
        notify:
          success: false
          failure: true

  code-quality-workflow:
    name: Code Quality Checks
    max_build_duration: 20
    instance_type: linux
    
    environment:
      flutter: stable
    
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Verify formatting
        script: |
          flutter format --set-exit-if-changed --dry-run .
      
      - name: Run code analysis
        script: |
          flutter analyze
      
      - name: Run all tests
        script: |
          flutter test --coverage
      
      - name: Check for outdated packages
        script: |
          flutter pub outdated
        ignore_failure: true
    
    publishing:
      email:
        recipients:
          - $RECIPIENT_EMAIL
        notify:
          success: false
          failure: true
