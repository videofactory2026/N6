workflows:
  android-debug-apk:
    name: Android Debug (APK) - No Keystore Needed

    max_build_duration: 120
    environment:
      node: 18
      java: 17
      vars:
        # Set this in Codemagic UI if you want to hit a real backend
        # EXPO_PUBLIC_API_BASE_URL: https://your-backend-url
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL}
    scripts:
      - name: Install deps
        script: |
          cd mobile
          npm ci
      - name: Expo prebuild (Android)
        script: |
          cd mobile
          npx expo prebuild --platform android --clean
      - name: Build Debug APK
        script: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - saudafzal33@gmail.com
        notify:
          success: true
          failure: true

  android-release-aab:
    name: Android Release (AAB) - Signed
    instance_type: linux_x2
    max_build_duration: 120
    environment:
      node: 18
      java: 17
      android_signing:
        - nutriwalk_keystore
      vars:
        # EXPO_PUBLIC_API_BASE_URL: https://your-backend-url
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL}
    scripts:
      - name: Install deps
        script: |
          cd mobile
          npm ci
      - name: Expo prebuild (Android)
        script: |
          cd mobile
          npx expo prebuild --platform android --clean
      - name: Build Release AAB
        script: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - saudafzal33@gmail.com
        notify:
          success: true
          failure: true

# IMPORTANT:
# - Use workflow "Android Debug (APK)" first. It DOES NOT need any keystore.
# - When you're ready for Play Store, add an Android keystore in Codemagic named: nutriwalk_keystore
