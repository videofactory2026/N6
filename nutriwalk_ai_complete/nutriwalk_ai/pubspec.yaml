name: nutriwalk_ai
description: AI-powered adaptive metabolic coaching application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  flutter_slidable: ^3.0.1
  
  # State Management
  provider: ^6.1.1
  
  # Storage & Encryption
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  
  # Network & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Image Processing
  image_picker: ^1.0.7
  image: ^4.1.3
  
  # Health & Sensors
  health: ^10.1.0
  pedometer: ^4.0.1
  permission_handler: ^11.1.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  
  # Utils
  uuid: ^4.3.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
